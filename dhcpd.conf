# ==============================================================================
# Fichier : /etc/dhcp/dhcpd.conf
# Description : Configuration du serveur ISC-DHCP pour les 3 VLANs
# ==============================================================================

default-lease-time 600;
max-lease-time 7200;
authoritative;

# VLAN 10 - Étudiants
subnet 192.168.10.0 netmask 255.255.255.0 {
  range 192.168.10.100 192.168.10.200;
  option routers 192.168.10.254;
  option domain-name-servers 192.168.10.254;
  option domain-name "etudiants.local";
}

# VLAN 20 - Personnel
subnet 192.168.20.0 netmask 255.255.255.0 {
  range 192.168.20.100 192.168.20.200;
  option routers 192.168.20.254;
  option domain-name-servers 192.168.20.254;
  option domain-name "personnel.local";
}

# VLAN 30 - Visiteurs / Invités
subnet 192.168.30.0 netmask 255.255.255.0 {
  range 192.168.30.100 192.168.30.200;
  option routers 192.168.30.254;
  option domain-name-servers 192.168.30.254;
  option domain-name "visiteurs.local";
}
