# /etc/dnsmasq.conf
# Configuration complète du serveur DHCP et Cache DNS pour les 3 VLANs

# -------------------------------------------------------------
# 1. PARAMÈTRES RÉSEAU ET ÉCOUTE
# -------------------------------------------------------------
# Écouter uniquement sur les sous-interfaces VLAN et loopback
interface=vlan10
interface=vlan20
interface=vlan30
interface=lo

# Ne jamais écouter sur l'interface WAN (sécurité)
except-interface=eth0

# Forcer dnsmasq à se lier uniquement aux interfaces spécifiées
bind-interfaces

# -------------------------------------------------------------
# 2. CONFIGURATION CACHE DNS
# -------------------------------------------------------------
# Taille du cache DNS (nombre d'entrées en mémoire)
cache-size=1500

# Ne pas transférer les requêtes sans domaine (ex: 'machine') aux serveurs DNS amont
domain-needed

# Ne pas transférer les requêtes de résolution inverse pour les plages privées
bogus-priv

# Serveurs DNS amont vers lesquels relayer les requêtes inconnues
server=1.1.1.1
server=8.8.8.8

# -------------------------------------------------------------
# 3. PLAGES DHCP (POOLS)
# -------------------------------------------------------------
# VLAN 10 - Étudiants : 192.168.10.50 à 192.168.10.200 (Bail 24 heures)
dhcp-range=vlan10,192.168.10.50,192.168.10.200,255.255.255.0,24h

# VLAN 20 - Personnel : 192.168.20.50 à 192.168.20.200 (Bail 24 heures)
dhcp-range=vlan20,192.168.20.50,192.168.20.200,255.255.255.0,24h

# VLAN 30 - Visiteurs : 192.168.30.50 à 192.168.30.200 (Bail 12 heures)
dhcp-range=vlan30,192.168.30.50,192.168.30.200,255.255.255.0,12h

# -------------------------------------------------------------
# 4. OPTIONS DHCP (Passerelle & DNS distribués aux clients)
# Option 3 = Passerelle par défaut (Default Router)
# Option 6 = Serveur DNS (la VM elle-même pour bénéficier du cache local)
# -------------------------------------------------------------
# VLAN 10
dhcp-option=vlan10,3,192.168.10.1
dhcp-option=vlan10,6,192.168.10.1

# VLAN 20
dhcp-option=vlan20,3,192.168.20.1
dhcp-option=vlan20,6,192.168.20.1

# VLAN 30
dhcp-option=vlan30,3,192.168.30.1
dhcp-option=vlan30,6,192.168.30.1

# -------------------------------------------------------------
# 5. JOURNALISATION (LOGS)
# -------------------------------------------------------------
# Activer pour voir les requêtes DHCP et requêtes DNS dans /var/log/syslog
log-dhcp
log-queries
log-facility=/var/log/dnsmasq.log
