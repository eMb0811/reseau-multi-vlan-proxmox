# Configuration Netplan initiale - Phase 1 (Découverte DHCP sur WAN)
# Fichier à placer dans /etc/netplan/01-netcfg.yaml ou /etc/netplan/50-cloud-init.yaml
#
# Remarque : si vos interfaces réelles s'appellent ens18 / ens19 (noms prédictibles Ubuntu/KVM),
# adaptez 'eth0' et 'eth1' ci-dessous en conséquence (vérifier avec 'ip link').

network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      dhcp4: true
      dhcp6: false
    eth1:
      dhcp4: false
      dhcp6: false

  vlans:
    vlan10:
      id: 10
      link: eth1
      addresses:
        - 192.168.10.1/24

    vlan20:
      id: 20
      link: eth1
      addresses:
        - 192.168.20.1/24

    vlan30:
      id: 30
      link: eth1
      addresses:
        - 192.168.30.1/24
