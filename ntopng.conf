# ==============================================================================
# Fichier : /etc/ntopng/ntopng.conf
# Description : Configuration NTOPng pour la VM routeur (VM 312)
#               Supervision exclusive des 3 VLANs du réseau local (LAN Only)
# ==============================================================================

# Interfaces LAN surveillées (Trunk 802.1Q vers le commutateur Cisco)
-i=ens19.10
-i=ens19.20
-i=ens19.30

# Port du serveur HTTP (Interface Web d'administration)
-w=3000

# Définition des sous-réseaux locaux pour le suivi des flux internes
-m=192.168.10.0/24,192.168.20.0/24,192.168.30.0/24

# Répertoire de stockage des données et métriques
-d=/var/lib/ntopng
